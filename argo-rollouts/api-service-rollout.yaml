apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-service-rollout
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service-api
  template:
    metadata:
      labels:
        app: api-service-api
    spec:
      containers:
      - name: api
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 100
