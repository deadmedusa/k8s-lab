apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/deadmedusa/k8s-lab.git
    targetRevision: main
    path: apps/analytics-worker
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
