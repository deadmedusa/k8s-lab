replicaCount: 2

image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 70

service:
  type: NodePort
  port: 80
  nodePort: 30080

env:
  - name: API_URL
    value: "http://api-service:8080"
  - name: LOG_LEVEL
    value: "info"
